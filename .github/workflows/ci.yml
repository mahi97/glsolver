name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install package (release build)
        run: pip install ".[dev]"
      - name: Lint
        run: ruff check src reference tests benchmarks scripts
      # Split by area so a failure is identifiable from the step name alone:
      # GitHub exposes step names and conclusions through the public jobs API,
      # while the logs need authentication.  `if: always()` runs every group,
      # so one run reports every failing area instead of only the first.
      - name: "tests: verifier, io, preconditions"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_verify.py tests/test_verify_review.py tests/test_io.py tests/test_preconditions.py tests/test_preconditions_review.py
      - name: "tests: oracles and generators"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_oracles.py tests/test_oracles_review.py tests/test_generators.py tests/test_generators_review.py
      - name: "tests: reference solvers"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_reference_primitives.py tests/test_reference_unweighted.py tests/test_reference_weighted.py tests/test_reference_dag.py tests/test_reference_review.py tests/test_compact_counterexample.py
      - name: "tests: core primitives"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_core_flow.py tests/test_core_dag.py tests/test_core_matching.py tests/test_core_review.py
      - name: "tests: core solvers"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_core_solver.py tests/test_core_weighted.py tests/test_core_solver_review.py tests/test_core_routing_review.py
      - name: "tests: api, cli, edge cases, regressions"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_api_cli.py tests/test_edge_cases.py tests/test_regression_store.py
      - name: "tests: exhaustive and property"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_exhaustive_small.py tests/test_property_solvers.py tests/test_harness_review.py
      - name: "tests: visualization"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_viz.py tests/test_viz_review.py
      - name: "tests: benchmark framework"
        if: always()
        run: pytest -q -m "not slow" -n auto --hypothesis-profile=ci tests/test_benchmarks.py tests/test_benchmarks_review.py
      - name: Verifier self-tests
        run: pytest -q tests/test_verify.py tests/test_verify_review.py -n auto

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build
      - name: Install package with ASan/UBSan and debug assertions
        env:
          GLCORE_SANITIZE: "ON"
          GLCORE_DEBUG_ASSERTS: "ON"
        run: pip install ".[dev]"
      - name: Core tests under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          # libstdc++ must be preloaded next to libasan: CPython does not link libstdc++ itself, and the
          # __cxa_throw interceptor of libasan resolves the real symbol at ASan init (before the extension
          # module dlopen()s libstdc++), so the first C++ exception would otherwise abort the interpreter.
          LIBASAN=$(gcc -print-file-name=libasan.so)
          LIBSTDCXX=$(gcc -print-file-name=libstdc++.so)
          LD_PRELOAD="$LIBASAN $LIBSTDCXX" pytest -q -m "not slow" tests/test_core_flow.py tests/test_core_dag.py tests/test_core_matching.py tests/test_core_solver.py tests/test_core_review.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t glsolver:ci .
      - name: Smoke test
        run: docker run --rm glsolver:ci solve --help
